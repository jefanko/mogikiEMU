name: Build and Release mgkEMU

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            zip

      - name: Compile mgkEMU
        shell: msys2 {0}
        run: |
          g++ -O3 -o mgkEMU.exe src/*.cpp \
            -lmingw32 -lSDL2main -lSDL2 -mwindows \
            -static-libgcc -static-libstdc++

      - name: Package Release ZIP
        shell: msys2 {0}
        run: |
          # Copy SDL2 runtime DLL from MSYS2 ucrt64 bin
          cp /ucrt64/bin/SDL2.dll ./
          
          # Create zip containing executable, dll, and docs
          zip -9 mgkEMU-windows-x64.zip mgkEMU.exe SDL2.dll README.md LICENSE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgkEMU-windows-x64
          path: mgkEMU-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mgkEMU-windows-x64.zip
          generate_release_notes: true
