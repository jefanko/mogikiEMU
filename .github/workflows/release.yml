name: Build and Release Mogiki NES Emulator

on:
  push:
    branches: [ main, csharp-experimental ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Mogiki NES
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Automated Unit Tests
        run: dotnet test --configuration Release --verbosity normal

      - name: Setup MSYS2 (for Legacy C++ Oracle Build)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            zip

      - name: Compile Legacy C++ Oracle
        shell: msys2 {0}
        run: |
          g++ -O3 -o mgkEMU_legacy.exe srcLegacy/*.cpp \
            -lmingw32 -lSDL2main -lSDL2 -mwindows \
            -static-libgcc -static-libstdc++

      - name: Publish Modern C# Avalonia Release
        run: |
          dotnet publish src/Mogiki.App/Mogiki.App.csproj -c Release -o ./publish

      - name: Package Release ZIP
        shell: msys2 {0}
        run: |
          # Copy legacy oracle binary and documentation into publish folder
          cp mgkEMU_legacy.exe ./publish/
          cp README.md LICENSE mgkEMU.png ./publish/ 2>/dev/null || true
          
          # Create release archive
          cd publish
          zip -9 -r ../Mogiki-NES-windows-x64.zip *
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mogiki-NES-windows-x64
          path: Mogiki-NES-windows-x64.zip

      - name: Publish Automatic GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Mogiki NES Emulator (Continuous Release)' }}
          body: |
            ### 🎮 Mogiki NES Emulator (mgkEMU)
            Automated Release Build for Windows x64.
            
            - **Modern Avalonia UI 11.x**: `Mogiki.App.exe`
            - **Legacy C++ Reference Oracle**: `mgkEMU_legacy.exe`
            - **Runtime**: Built with .NET 10 & SDL2
            
            *Download `Mogiki-NES-windows-x64.zip` below to play!*
          files: Mogiki-NES-windows-x64.zip
          generate_release_notes: true
